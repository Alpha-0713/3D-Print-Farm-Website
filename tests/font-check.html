<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inter rendering verification · 3D Print Farm</title><link rel="stylesheet" href="../src/fonts.css?v=inter-4.1-render-check"><style>body{font:16px/1.5 "Inter",Arial,sans-serif;margin:36px;background:#171717;color:#eee}h1{font-size:24px}#sample{font-size:56px;font-weight:600;letter-spacing:-.035em;line-height:1.07}pre{white-space:pre-wrap;font-family:inherit;padding:20px;border:1px solid #555}iframe{width:100%;height:450px;border:1px solid #555}.pass{color:#9fca9e}</style></head><body><h1>Inter rendering verification</h1><p>This checks the actual page styles and loaded fonts in this browser. It does not change job records or account settings.</p><pre id="result" role="status">Checking…</pre><div id="sample">Big ideas.<br>Made tangible.</div><iframe title="Current homepage font check" src="../index.html?font-render-check=inter-4.1#/"></iframe><script type="module">
const result=document.querySelector('#result'),frame=document.querySelector('iframe');
const wait=async predicate=>{const end=Date.now()+15000;while(Date.now()<end){if(predicate())return;await new Promise(r=>setTimeout(r,40));}throw Error('The homepage did not finish loading.');};
try{
 await wait(()=>frame.contentDocument?.querySelector('.hero h1'));
 const page=frame.contentDocument,heading=page.querySelector('.hero h1'),style=frame.contentWindow.getComputedStyle(heading);
 const faces=await page.fonts.load(`${style.fontWeight} ${style.fontSize} "Inter"`);await page.fonts.ready;
 if(!style.fontFamily.split(',')[0].replaceAll('"','').trim().startsWith('Inter'))throw Error('The homepage is requesting '+style.fontFamily);
 if(!faces.length||faces.some(face=>face.status!=='loaded'))throw Error('Inter is declared but the browser did not load its font face.');
 const fresh=new FontFace('FreshInterProof','url("../assets/fonts/InterVariable.woff2?v=inter-4.1-render-proof")',{weight:'100 900',style:'normal'});await fresh.load();page.fonts.add(fresh);
 const raster=family=>{const canvas=page.createElement('canvas');canvas.width=1200;canvas.height=180;const ctx=canvas.getContext('2d');ctx.font=`600 56px "${family}"`;ctx.fillStyle='white';ctx.fillText('Big ideas. Made tangible. aAgG1l0',10,90);return{width:ctx.measureText('Big ideas. Made tangible. aAgG1l0').width,image:canvas.toDataURL()};};
 const current=raster('Inter'),proof=raster('FreshInterProof'),fallback=raster('Arial');
 if(current.image!==proof.image)throw Error('The cached Inter face differs from the freshly fetched official font file.');
 if(current.image===fallback.image)throw Error('The Inter sample rendered identically to the Arial fallback.');
 const rows=[
 'PASS · The homepage requests Inter as its first font family.',
 'PASS · Safari/browser reports the Inter font face as loaded.',
 'PASS · Its rendered glyphs match a fresh, cache-bypassed copy of the bundled Inter file exactly.',
 'PASS · The rendered Inter sample differs from Arial fallback.',
 '',
 'Homepage heading family: '+style.fontFamily,
 'Heading weight: '+style.fontWeight+' · size: '+style.fontSize+' · spacing: '+style.letterSpacing,
 'Loaded face: '+faces.map(face=>face.family+' ('+face.status+', weights '+face.weight+')').join(', '),
 'Inter test width: '+current.width.toFixed(3)+'px · Arial test width: '+fallback.width.toFixed(3)+'px',
 'Font asset: '+new URL('../assets/fonts/InterVariable.woff2',location.href).href,
 '',
 'The homepage retains its previous weight and tight letter spacing. A different font can therefore retain a similar overall silhouette.'
 ];result.textContent=rows.join('\n');result.className='pass';
}catch(error){result.textContent='FAIL · '+error.message;}
</script></body></html>
