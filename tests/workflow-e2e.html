<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Full workflow checks · v2.2</title><style>@import url("../src/fonts.css");body{font:14px/1.6 "Inter", Arial, sans-serif;background:#181818;color:#eee;margin:20px}button{padding:10px 16px;cursor:pointer}pre{white-space:pre-wrap}iframe{width:100%;height:760px;border:1px solid #555}</style></head><body><h1>Full workflow checks · v2.2 Beta</h1><p>Uses the production app in the frame, with a synthetic model-file selection and test-only confirmation answers. Prior browser data is backed up and restored after the run. No email is sent.</p><button id="run" disabled>Run full workflow</button><pre id="result" role="status">Ready.</pre><iframe title="Production app under test" id="app-frame"></iframe><script>window.addEventListener("error",event=>{document.querySelector("#result").textContent="FAIL · "+event.message;});</script><script type="module">
import { modelFilesStore } from '../src/modelFilesStore.js?v=2.3';
import { LOCAL_DATA_KEYS, jobsService } from '../src/services.js?v=2.2&rev=5';
const frame=document.querySelector('iframe'), result=document.querySelector('#result'), run=document.querySelector('#run');
const key='three-d-print-farm-demo-v3';const read=()=>JSON.parse(localStorage.getItem(key));
run.onclick=async()=>{
 run.disabled=true;result.textContent='Running…';const passed=[];const savedModelIds=[];
 const backup=Object.fromEntries(LOCAL_DATA_KEYS.map(k=>[k,localStorage.getItem(k)]));
 sessionStorage.setItem('printfarm-workflow-qa-backup',JSON.stringify(backup));
 let observer=null;
 const check=(condition,label)=>{if(!condition)throw new Error(label);passed.push('PASS · '+label);result.textContent=passed.join('\n');};
 const wait=async(predicate,label)=>{const deadline=Date.now()+20000;while(Date.now()<deadline){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,30));}throw new Error('Timed out: '+label+' · '+(frame.contentDocument?.querySelector('#file-feedback')?.textContent||frame.contentDocument?.querySelector('#toast-root')?.textContent||''));};
 const doc=()=>frame.contentDocument;
 const find=(selector)=>{const e=doc().querySelector(selector);if(!e)throw new Error('Control not found: '+selector);return e;};
 const click=(selector)=>find(selector).click();
 const input=(selector,value)=>{const e=find(selector);e.value=value;e.dispatchEvent(new frame.contentWindow.Event('input',{bubbles:true}));e.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));};
 const action=(name)=>click('[data-action="'+name+'"]');
 const select=async(number)=>{click('.role-switcher > summary');click('[data-identity-id="demo-person-'+String(number).padStart(2,'0')+'"]');await wait(()=>doc().querySelector('.staff-app')?.dataset.identityId==='demo-person-'+String(number).padStart(2,'0')||doc().querySelector('.role-switcher summary')?.getAttribute('aria-label')?.includes(number===1?'Mr. Q':'never'),'identity switch');};
 const route=async(hash,selector)=>{frame.contentWindow.location.hash=hash;await wait(()=>doc().querySelector(selector),'route '+hash);};
 try{
 localStorage.setItem(key,JSON.stringify({jobs:[],notifications:[],inventory:[{id:'qa-full',material:'PLA',color:'QA Gray',hexColor:'#808080',available:true,lowStock:false}],contributions:[],hours:{transactions:[],requests:[]}}));localStorage.setItem('three-d-print-farm-demo-role','demo-person-01');
 frame.src='../index.html#/get-started';await wait(()=>doc()?.querySelector('#model-file'),'request wizard');
 frame.contentWindow.confirm=()=>true;frame.contentWindow.prompt=()=> 'Rotate the model before printing.';
 const bytes=await(await fetch('./fixtures/test-part.stl')).arrayBuffer();const transfer=new frame.contentWindow.DataTransfer();transfer.items.add(new frame.contentWindow.File([bytes],'test-part.stl',{type:'model/stl'}));find('#model-file').files=transfer.files;find('#model-file').dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));
 await wait(()=>doc().querySelector('.model-preview-message')?.textContent.includes('Drag to orbit'),'model preview');check(true,'Real request wizard accepts and previews the synthetic STL selection');
 action('wizard-next');await wait(()=>doc().querySelector('[data-inventory-id]')||doc().querySelector('.filament-palette'),'filament choices');
 const radio=find('input[type="radio"][name="inventoryId"], .filament-palette input[type="radio"]');radio.checked=true;radio.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));
 action('wizard-next');await wait(()=>doc().querySelector('[data-field="projectName"]'),'project details');input('[data-field="projectName"]','QA full workflow bracket');
 action('wizard-next');await wait(()=>doc().querySelector('[data-action="submit-request"]'),'review');action('submit-request');await wait(()=>read().jobs.length===1,'request saved');
 const jobId=read().jobs[0].id;savedModelIds.push(...(read().jobs[0].attachments||[]).map(file=>file.id));check(read().jobs[0].status==='SUBMITTED','Level 1 submission starts pending supervisor review');
 await route('#/my-jobs','.request-row');check(find('.request-row').textContent.includes('QA full workflow bracket'),'My Print Jobs lists the owning submitter’s new request');
 const row=find('.request-row'),link=find('.request-row-action');check(getComputedStyle(link).justifyContent==='flex-start'&&getComputedStyle(link,'::after').position==='absolute','Card link covers the row and keeps the arrow beside View details');
 link.click();await wait(()=>doc().querySelector('.job-progress'),'own print progress');check(find('.progress-stage.is-current').textContent.includes('Supervisor review'),'Submitter progress shows the pending review');
 click('.role-switcher > summary');click('[data-identity-id="demo-person-02"]');await route('#/staff','.staff-app');await wait(()=>doc().querySelector('.staff-app')?.dataset.identityId==='demo-person-02','member dashboard');
 check(!find('.staff-content').textContent.includes('QA full workflow bracket'),'Pending request is absent from member overview');
 await route('#/staff/jobs/'+encodeURIComponent(jobId),'.empty-state');check(!doc().querySelector('[data-action="claim-job"]'),'Direct details route cannot expose or claim the pending job');
 await select(4);await route('#/staff','.supervisor-review-queue');click('.inbox-picker > summary');await wait(()=>doc().querySelector('.inbox-entry'),'initial review notification');click('.inbox-entry');await wait(()=>doc().querySelector('.inbox-detail [data-action="approve-job"]'),'review actions');
 check(!read().inbox.some(item=>item.userId==='demo-person-04'&&item.kind==='initial-review'),'Opening initial review removes its inbox record');action('approve-job');await wait(()=>read().jobs[0].status==='APPROVED','initial approval');check(read().jobs[0].initialApproval.byId==='demo-person-04','Supervisor approval is saved through the real notification action');
 await select(2);click('.inbox-picker > summary');await wait(()=>doc().querySelector('.inbox-entry'),'new job alert');click('.inbox-entry');await wait(()=>doc().querySelector('.inbox-detail [data-action="claim-job"]'),'claim action');action('claim-job');await wait(()=>read().jobs[0].assignedStaffId==='demo-person-02','claim');
 await route('#/staff/jobs/'+encodeURIComponent(jobId),'[data-action="request-authorization"]');check(!doc().querySelector('[data-action="start-printing"]'),'Preparation offers authorization request and cannot start printing');action('request-authorization');await wait(()=>read().jobs[0].status==='AWAITING_AUTHORIZATION','authorization request');
 await select(4);click('.inbox-picker > summary');await wait(()=>doc().querySelector('.inbox-entry'),'print review alert');click('.inbox-entry');await wait(()=>doc().querySelector('[data-action="revise-print"]'),'revision action');action('revise-print');await wait(()=>read().jobs[0].status==='IN_PROGRESS','revision saved');check(read().jobs[0].printAuthorization.reason==='Rotate the model before printing.','Supervisor revision reason is saved through the notification action');
 await select(2);await route('#/staff/jobs/'+encodeURIComponent(jobId),'[data-action="request-authorization"]');check(find('.workflow-reason').textContent.includes('Rotate the model'),'Responsible member sees the requested changes');action('request-authorization');await wait(()=>read().jobs[0].status==='AWAITING_AUTHORIZATION','resubmission');
 await select(4);await route('#/staff/jobs/'+encodeURIComponent(jobId),'[data-action="authorize-print"]');action('authorize-print');await wait(()=>read().jobs[0].status==='AUTHORIZED','authorization');
 await select(2);await wait(()=>doc().querySelector('[data-action="start-printing"]'),'start printing action');action('start-printing');await wait(()=>read().jobs[0].status==='PRINTING','printing');action('complete-job');await wait(()=>doc().querySelector('#completion-dialog'),'completion dialog');input('[name="pickupLocation"]','QA collection desk');input('[name="pickupInstructions"]','Ask the test supervisor.');find('[name="notifyRecipient"]').checked=false;click('#completion-dialog [type="submit"]');await wait(()=>read().jobs[0].status==='COMPLETED','ready for pickup');action('collect-job');await wait(()=>read().jobs[0].status==='COLLECTED','collection');check(true,'Real staff actions complete the approved print through collection');
 await route('#/staff/hours','[data-form="hours-request"]');input('[name="hours"]','1.5');input('[name="reason"]','QA print preparation');click('[data-form="hours-request"] [type="submit"]');await wait(()=>read().hours.requests.length===1,'hours request');
 await select(4);click('.inbox-picker > summary');await wait(()=>doc().querySelector('.inbox-entry'),'hours alert');click('.inbox-entry');await wait(()=>doc().querySelector('[data-action="hours-approve"]'),'hours decision');action('hours-approve');await wait(()=>read().hours.requests[0].status==='Approved','hours approval');check(read().hours.transactions[0].deltaCenti===150,'Hours notification approval applies the requested balance transaction once');
 await select(2);click('.inbox-picker > summary');await wait(()=>doc().querySelector('.inbox-entry'),'hours added alert');check(find('.inbox-panel').textContent.includes('Hours added'),'Member receives the hours-added notification');
 const refreshed=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.contentWindow.location.reload();await refreshed;await wait(()=>doc().querySelector('.staff-app'),'refresh');await wait(()=>doc().querySelector('.inbox-dot')&&!doc().querySelector('.inbox-dot').hidden,'persistent unread dot');check(true,'Refresh preserves the current user’s unread inbox');
 click('.role-switcher > summary');click('[data-identity-id="demo-person-01"]');await route('#/my-jobs/'+encodeURIComponent(jobId),'.pickup-details');check(find('.pickup-details').textContent.includes('QA collection desk')&&find('.pickup-details').textContent.includes('Print collected'),'Owning submitter sees saved pickup information and collection');
 check(find('.job-progress').querySelectorAll('.is-done').length>=8,'Shared Print Progress records all approval and printing stages');
 click('.role-switcher > summary');click('[data-identity-id="demo-person-04"]');await route('#/staff','.supervisor-review-queue');
 observer=document.createElement('iframe');observer.title='Same-origin notification observer';document.body.append(observer);observer.src='../index.html#/staff';
 await wait(()=>observer.contentDocument?.querySelector('.inbox-picker summary')?.getAttribute('aria-label')?.startsWith('Inbox,'),'second dashboard');
 const beforeNotifications=read().inbox.filter(item=>item.userId==='demo-person-04').length;
 await jobsService.createJob({submissionKey:crypto.randomUUID(),projectName:'QA same-origin notification',modelUrl:'https://example.com/qa.stl',inventoryId:'qa-full',material:'PLA',color:'QA Gray'});
 await wait(()=>observer.contentDocument.querySelector('.inbox-picker summary')?.getAttribute('aria-label')?.includes(String(beforeNotifications+1)+' unread'),'same-origin notification');
 check(observer.contentDocument.querySelector('#inbox-toast-root .inbox-toast'),'Another same-origin dashboard receives the new notification, unread dot, and popup');
 click('.role-switcher > summary');click('[data-identity-id="demo-person-02"]');
 await wait(()=>observer.contentDocument.querySelector('.staff-app')?.dataset.identityId==='demo-person-02','observer account switch');
 check(!observer.contentDocument.querySelector('.inbox-detail')&&observer.contentDocument.querySelector('.staff-app').dataset.identityId==='demo-person-02','Same-origin identity switches clear the previous user’s notification view');
 result.textContent=passed.length+' full workflow checks passed\n'+passed.join('\n');
 }catch(error){result.textContent=passed.join('\n')+'\nFAIL · '+error.message;console.error(error);}
 finally{await modelFilesStore.remove(savedModelIds);if(observer){observer.src='about:blank';observer.remove();}frame.src='about:blank';await new Promise(resolve=>setTimeout(resolve,50));for(const[k,v]of Object.entries(backup)){if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}sessionStorage.removeItem('printfarm-workflow-qa-backup');run.disabled=false;}
};
document.querySelector("#run").disabled=false;
</script></body></html>
