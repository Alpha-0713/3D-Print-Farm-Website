<!doctype html><html lang="en" data-theme="dark" data-accent="monochrome"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI refinement checks · v2.2</title>
<link rel="stylesheet" href="../src/styles.css?v=2.2&rev=9">
<style>.qa-tools{padding:20px}.qa-tools h1{font-size:20px}.qa-tools button{padding:10px}#results{white-space:pre-wrap;font:12px/1.6 system-ui}.qa-anchor{position:fixed;z-index:1003;transform:translateZ(0);overflow:hidden;width:124px;height:36px}.qa-anchor .toolbar-controls{margin:0}</style>
</head><body><div class="qa-tools"><h1>UI refinement checks</h1><button id="run" disabled>Run layout checks</button><pre id="results" role="status">Loading production components…</pre></div><div id="fixture"></div><div id="corners"></div>
<script type="module">
import { staffShell } from '../src/staffPages.js?v=2.2&rev=5';
import { toolbarControls, publicHeader } from '../src/pageShared.js?v=2.2&rev=5';
import { syncFloatingControls } from '../src/floatingControls.js?v=2.2&rev=5';
import { syncSidebarSelection } from '../src/sidebarSelection.js?v=2.2&rev=5';
import { commitPage } from '../src/pageCommit.js?v=2.2&rev=5';
import { authService, DEMO_ROLE_STORAGE_KEY } from '../src/authService.js?v=2.2&rev=5';
const root=document.querySelector('#fixture'), corners=document.querySelector('#corners'), results=document.querySelector('#results'), run=document.querySelector('#run');
const frame=()=>new Promise(requestAnimationFrame);
const settle=async()=>{await frame();await frame();};
const close=()=>document.querySelectorAll('.toolbar-controls details[open]').forEach(p=>p.open=false);
const almost=(a,b)=>Math.abs(a-b)<.6;
const rect=(s)=>root.querySelector(s).getBoundingClientRect();
run.disabled=false;results.textContent='Ready. Checks restore the original theme and identity; no work records are changed.';
run.onclick=async()=>{
 run.disabled=true;results.textContent='Running layout checks…';const passed=[];const savedRole=localStorage.getItem(DEMO_ROLE_STORAGE_KEY), savedTheme=document.documentElement.dataset.theme;
 const check=(value,label)=>{if(!value)throw Error(label);passed.push('PASS · '+label);};
 try{
 authService.switchRole('demo-person-02');
 for(const theme of ['dark','light']){
  document.documentElement.dataset.theme=theme;
  commitPage(root,staffShell('<article class="metric-card"><strong>Preview</strong></article><section class="detail-section"><input aria-label="Preview input"><div class="review-card">Secondary glass</div></section>'));
  syncFloatingControls(root);syncSidebarSelection(root);await settle();
  const summaries=[...root.querySelectorAll('.toolbar-controls > :is(.appearance-controls,.role-switcher,.inbox-picker)')];
  check(summaries.length===3&&summaries[0].matches('.appearance-controls')&&summaries[1].matches('.role-switcher')&&summaries[2].matches('.inbox-picker'),theme+' toolbar order is Appearance → Identity → Inbox');
  const boxes=[...root.querySelectorAll('.toolbar-controls > .appearance-controls summary,.toolbar-controls > .role-switcher > summary,.toolbar-controls > .inbox-picker > summary')].map(e=>e.getBoundingClientRect());
  check(boxes.every(r=>almost(r.width,36)&&almost(r.height,36)&&almost(r.top,boxes[0].top)),theme+' toolbar controls have equal dimensions and vertical alignment');
  const centered=[...root.querySelectorAll('.toolbar-controls > .appearance-controls summary,.toolbar-controls > .role-switcher > summary,.toolbar-controls > .inbox-picker > summary')].every(summary=>{const outer=summary.getBoundingClientRect(),inner=summary.firstElementChild.getBoundingClientRect();return almost(outer.x+outer.width/2,inner.x+inner.width/2)&&almost(outer.y+outer.height/2,inner.y+inner.height/2);});
  check(centered,theme+' toolbar glyphs and initials are centered inside their control faces');
  check(root.querySelector('.role-trigger-initials').textContent==='LT'&&!root.querySelector('.role-trigger-name'),theme+' collapsed identity contains initials only');
  check(!root.querySelector('[type="range"], [data-action="set-accent"]'),theme+' adjustable transparency and saturated accent controls are absent');
  const toolbar=rect('.staff-toolbar'), inbox=rect('.inbox-picker > summary');
  check(almost(toolbar.right-inbox.right,inbox.top-toolbar.top),theme+' top-right corner has mirrored clearance');
  if(innerWidth>=768){
   const brand=rect('.sidebar-brand .brand svg'),side=rect('.staff-sidebar'),back=rect('.back-public svg');
   check(almost(brand.left-side.left,brand.top-side.top)&&almost(back.left-side.left,side.bottom-back.bottom),theme+' sidebar top-left and bottom-left corners mirror their insets');
   check([...root.querySelectorAll('.sidebar-link > span:first-child')].every(e=>almost(e.getBoundingClientRect().left,brand.left))&&almost(back.left,brand.left),theme+' logo, navigation icons, and back arrow share a leading rail');
  }
  check([...root.querySelectorAll('.metric-card,.detail-section,input,.review-card,.toolbar-controls summary')].filter(e=>!e.closest('.role-create-account')).every(e=>getComputedStyle(e).borderTopLeftRadius==='12px'),theme+' primary surfaces, nested panels, controls and inputs share 12px corners');
  const primary=getComputedStyle(root.querySelector('.metric-card')).backgroundColor,secondary=getComputedStyle(root.querySelector('.review-card')).backgroundColor;
  check(!primary.startsWith('rgba')&&secondary.includes('0.94'),theme+' main surfaces are solid and secondary glass uses the fixed 6% mapping');
  const initial=[...root.querySelectorAll('.sidebar-link')].map(e=>e.getBoundingClientRect());
  commitPage(root,staffShell('<p>Another page</p>','hours'));syncFloatingControls(root);syncSidebarSelection(root);await settle();
  check([...root.querySelectorAll('.sidebar-link')].every((e,i)=>almost(e.getBoundingClientRect().x,initial[i].x)&&almost(e.getBoundingClientRect().y,initial[i].y)&&almost(e.getBoundingClientRect().height,initial[i].height)),theme+' selected and unselected rows retain identical geometry');
  close();
  for(const vertical of ['top','bottom'])for(const horizontal of ['left','right']){
   const anchor=document.createElement('div');anchor.className='qa-anchor';anchor.style[vertical]='22px';anchor.style[horizontal]='22px';anchor.innerHTML=toolbarControls();corners.append(anchor);syncFloatingControls(corners);
   for(const selector of ['.accent-picker','.role-switcher','.inbox-picker']){
    const picker=anchor.querySelector(selector);picker.querySelector('summary').click();await settle();
    const menu=picker.querySelector('.viewport-menu');
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches)check(getComputedStyle(menu).animationName==='liquid-menu-in'&&getComputedStyle(menu).animationDuration==='0.28s',`${theme} ${vertical}-${horizontal} ${selector} uses the shared glass opening motion`);
    await Promise.all(menu.getAnimations().map(a=>a.finished.catch(()=>{})));
    const r=menu.getBoundingClientRect();
    check(r.left>=20&&r.top>=20&&r.right<=innerWidth-20&&r.bottom<=innerHeight-20,`${theme} ${vertical}-${horizontal} ${selector} stays inside viewport gutters`);
    check(menu.contains(document.elementFromPoint(r.left+r.width/2,r.top+Math.min(r.height/2,30))),`${theme} ${vertical}-${horizontal} ${selector} escapes the clipped glass parent`);
    if(selector==='.role-switcher'){
     picker.querySelector('.role-create-account > summary').click();await settle();
     const input=picker.querySelector('input');const ir=input.getBoundingClientRect();
     check(ir.top>=r.top&&ir.bottom<=r.bottom&&document.activeElement===input,`${theme} ${vertical}-${horizontal} nested account form stays reachable`);
    }
    picker.open=false;await settle();
   }
   anchor.remove();syncFloatingControls(corners);
  }
  commitPage(root,publicHeader({menuOpen:false}));syncFloatingControls(root);await settle();
  check(document.documentElement.scrollWidth<=innerWidth,theme+' public header fits the viewport');
  check([...root.querySelectorAll('.toolbar-controls > .appearance-controls summary,.toolbar-controls > .role-switcher > summary,.toolbar-controls > .inbox-picker > summary')].every(summary=>{const a=summary.getBoundingClientRect(),b=summary.firstElementChild.getBoundingClientRect();return almost(a.x+a.width/2,b.x+b.width/2)&&almost(a.y+a.height/2,b.y+b.height/2);}),theme+' public header glyphs and initials remain centered');
 }
 results.textContent=passed.length+' layout checks passed at '+innerWidth+'px\n'+passed.join('\n');
 }catch(error){results.textContent=passed.join('\n')+'\nFAIL · '+error.message;}
 finally{close();corners.replaceChildren();root.replaceChildren();document.documentElement.dataset.theme=savedTheme;authService.switchRole(savedRole||'demo-person-01');run.disabled=false;}
};
</script></body></html>
